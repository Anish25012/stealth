name: CI
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,app]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov --cov-report=term-missing

  # Builds the installer, installs it the way a person would, and runs the smoke test against the
  # installed copy. These runners aren't clean machines, so a real clean install is still manual.
  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[app,build]"

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build
        run: python packaging/build.py

      # A fresh runner is the closest thing to a family member's PC we can test on every push.
      # Defender is the antivirus everyone has; if it flags the build, nobody else should get it.
      - name: Microsoft Defender scan (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { Write-Warning "Defender isn't on this runner"; exit 0 }
          & $mp -SignatureUpdate | Out-Host  # best effort: stale definitions still scan
          foreach ($target in @((Get-Content dist/artifact.txt), (Resolve-Path dist/Stealth).Path)) {
            & $mp -Scan -ScanType 3 -File $target -DisableRemediation | Out-Host
            if ($LASTEXITCODE -eq 2) { throw "Defender flagged $target" }
            if ($LASTEXITCODE -ne 0) { Write-Warning "Defender scan of $target exited $LASTEXITCODE" }
          }

      - name: Install, smoke test, uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-Content dist/artifact.txt
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\Stealth\Stealth.exe"
          if (-not (Test-Path $app)) { throw "not installed at $app" }
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Stealth\Stealth.lnk"
          if (-not (Test-Path $menu)) { throw "no Start menu shortcut" }
          $report = "$env:RUNNER_TEMP\smoke.json"
          $s = Start-Process $app -ArgumentList '--smoke-test','--with-window','--report',$report -Wait -PassThru
          Get-Content $report
          if ($s.ExitCode -ne 0) { throw "smoke test exited $($s.ExitCode)" }
          # Upgrading over a running copy: the tray app holds its files open, so the installer
          # must ask it to quit first. Then the same for uninstalling.
          function Start-Agent {
            Start-Process $app -ArgumentList '--background'
            $agentFile = "$env:LOCALAPPDATA\Stealth\agent.json"
            for ($i = 0; $i -lt 60 -and -not (Test-Path $agentFile); $i++) { Start-Sleep 1 }
            if (-not (Test-Path $agentFile)) { throw "the app didn't start" }
            Start-Sleep 2
          }
          Start-Agent
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "upgrade over a running copy exited $($p.ExitCode)" }
          if (Get-Process Stealth -ErrorAction SilentlyContinue) { throw "the old copy is still running" }
          Start-Agent
          $u = Start-Process "$env:LOCALAPPDATA\Programs\Stealth\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait -PassThru
          Start-Sleep 3
          if (Test-Path $app) { throw "uninstall left the app behind" }

      - name: Mount, smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg="$(cat dist/artifact.txt)"
          hdiutil attach "$dmg" -mountpoint /Volumes/Stealth -nobrowse
          cp -R /Volumes/Stealth/Stealth.app "$RUNNER_TEMP/"
          hdiutil detach /Volumes/Stealth
          "$RUNNER_TEMP/Stealth.app/Contents/MacOS/Stealth" --smoke-test --report "$RUNNER_TEMP/smoke.json"

      # Allowed to fail while macOS support is parked: the page doesn't load in WKWebView on the
      # runner. See https://github.com/Anish25012/stealth/issues/1. Every other macOS check is
      # required by the step above. Remove continue-on-error when that issue is fixed.
      - name: Window smoke check (macOS, allowed to fail)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/Stealth.app/Contents/MacOS/Stealth" --smoke-test --with-window --report "$RUNNER_TEMP/smoke-window.json"

      # Linux is best effort (see the plan): headless checks only, until a GTK WebKit build is
      # bundled. xvfb gives the tray backend a display to load against.
      - name: Unpack, smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          mkdir "$RUNNER_TEMP/app" && tar -xzf "$(cat dist/artifact.txt)" -C "$RUNNER_TEMP/app"
          xvfb-run -a "$RUNNER_TEMP/app/Stealth/Stealth" --smoke-test --report "$RUNNER_TEMP/smoke.json"

      - uses: actions/upload-artifact@v4
        with:
          name: stealth-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.tar.gz
          retention-days: 14

  # Pushing a tag like v0.2.0 builds everything as usual, then puts the installers on a draft
  # release. Nothing is public until the draft is published by hand on GitHub.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the app's version
        run: |
          version=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/stealth/__init__.py').read())[1])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match __version__ ${version}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/*
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* --draft --verify-tag \
            --title "Stealth ${GITHUB_REF_NAME#v}" \
            --notes "Windows: download Stealth-${GITHUB_REF_NAME#v}-windows-setup.exe. See [Installing Stealth](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/installing.md). macOS and Linux builds are untested."
