[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stealth-privacy"
version = "0.1.0"
description = "Open-source, UK-first personal data removal that runs entirely on your own computer."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "aiosmtpd>=1.4",        # runtime: `stealth demo` runs a local fake mail server
    "cryptography>=42",
    "jinja2>=3.1",
    "jsonschema>=4.21",
    "keyring>=25",
    "truststore>=0.9",      # verify TLS with the OS trust store, so HTTPS-inspecting antivirus works
    "platformdirs>=4",
    "sqlcipher3-wheels>=0.5.7",
    "typer>=0.12",
    "tzdata>=2024.1",       # Windows has no system zoneinfo database
]

[project.optional-dependencies]
# The desktop app. The engine and command line work without any of these.
app = [
    "fastapi>=0.115",
    "pillow>=10",
    "playwright>=1.45",     # the scan's search window; drives the Edge or Chrome already installed
    "pystray>=0.19",
    "pywebview>=5",
    "reportlab>=4.2",       # the monthly report as a PDF
    "uvicorn>=0.30",
]
build = [
    "pyinstaller>=6.10",
]
dev = [
    "httpx>=0.27",          # FastAPI's TestClient
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "pyyaml>=6",
    "ruff>=0.5",
    "types-jsonschema",
    "types-PyYAML",
]

[project.scripts]
stealth = "stealth_cli.main:run"

[project.gui-scripts]
stealth-app = "stealth_app.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stealth", "src/stealth_cli", "src/stealth_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["stealth"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "S", "T20", "DTZ"]
ignore = [
    "S101",   # assert is fine in tests, and engine asserts are invariants
    "S311",   # random is used for pacing jitter, not security
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20", "DTZ"]
"tools/**" = ["T20", "S310"]
"src/stealth_cli/**" = ["B008", "T20"]   # Typer's documented option-default pattern
"src/stealth_app/smoke.py" = ["T20", "S310"]  # prints its report; URLs are fixed loopback
"src/stealth_app/runtime.py" = ["S310"]        # URLs are fixed http://127.0.0.1
"packaging/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["stealth", "stealth_cli", "stealth_app"]

[[tool.mypy.overrides]]
module = ["sqlcipher3.*", "aiosmtpd.*", "keyring.*", "webview.*", "pystray.*", "reportlab.*"]
ignore_missing_imports = true
